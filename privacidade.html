<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaração de Privacidade | UnISCED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        
        body {
            background: linear-gradient(-45deg, #e0f2fe, #fae8ff, #fef3c7, #d1fae5);
            background-size: 400% 400%;
            animation: liquidMove 18s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        body.dark {
            background: linear-gradient(-45deg, #1e293b, #0f172a, #1e1b4b, #0c4a6e);
            background-size: 400% 400%;
            animation: liquidMove 18s ease infinite;
        }
        
        @keyframes liquidMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
            z-index: 0;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.15);
        }
        
        body.dark .glass-card {
            background: rgba(30, 41, 59, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        body.dark .glass-card .text-gray-700,
        body.dark .glass-card .text-gray-600,
        body.dark .glass-card .text-gray-800 {
            color: #e2e8f0 !important;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            text-decoration: none;
        }
        
        body.dark .back-btn {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateX(-3px);
        }
        
        body.dark .back-btn:hover {
            background: rgba(30, 41, 59, 0.7);
        }
        
        .theme-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body.dark .theme-btn {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .theme-btn:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.6);
        }
        
        .lang-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        body.dark .lang-btn {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }
        
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- Botões flutuantes -->
    <div class="fixed top-6 right-6 z-50 flex items-center gap-3">
        <button id="theme-toggle" class="theme-btn">
            <i id="theme-icon" class="fa-solid fa-moon text-sm text-gray-700 dark:text-gray-300"></i>
        </button>
        <button id="btn-idioma" class="lang-btn">
            <span id="idioma-atual">PT</span>
        </button>
    </div>

    <div class="max-w-3xl w-full relative z-10">
        <!-- Botão Voltar - agora com href para index.html -->
        <div class="mb-6">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span id="back-text">Voltar</span>
            </a>
        </div>

        <!-- Card principal -->
        <div class="glass-card rounded-3xl p-8 md:p-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-500 to-cyan-600 rounded-2xl flex items-center justify-center shadow-lg mb-4">
                    <i class="fa-solid fa-shield-haltered text-2xl text-white"></i>
                </div>
                <h1 id="page-title" class="text-3xl md:text-4xl font-black text-gray-800">Declaração de Privacidade</h1>
                <p id="page-subtitle" class="text-gray-500 dark:text-gray-400 text-sm mt-2">Política de Acesso Aberto e Licenciamento</p>
            </div>

            <div id="content" class="space-y-6 text-gray-700 dark:text-gray-300 leading-relaxed">
                <!-- Conteúdo dinâmico via JS -->
            </div>
        </div>
    </div>

    <script>
        // ================== MODO DARK ==================
        let dark = false;
        function toggleTheme() {
            dark = !dark;
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (dark) {
                body.classList.add('dark');
                if (icon) icon.className = 'fa-solid fa-sun text-sm text-gray-300';
            } else {
                body.classList.remove('dark');
                if (icon) icon.className = 'fa-solid fa-moon text-sm text-gray-700';
            }
        }
        document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);

        // ================== MENU IDIOMA ==================
        const btnIdioma = document.getElementById('btn-idioma');
        let lang = 'pt';

        const textos = {
            pt: {
                back: "Voltar",
                page_title: "Declaração de Privacidade",
                page_subtitle: "Política de Acesso Aberto e Licenciamento",
                content: `
                    <div class="space-y-5">
                        <div class="bg-blue-50 dark:bg-blue-900/20 p-5 rounded-xl border border-blue-100 dark:border-blue-800">
                            <h2 class="text-xl font-black text-blue-800 dark:text-blue-300 mb-3">📖 Acesso Aberto</h2>
                            <p>A revista adopta a política de <strong>acesso aberto</strong>, sendo que todos os artigos publicados estarão disponíveis online, sem nenhum custo para os leitores. Assim, os leitores terão permissão para ler, baixar, copiar, distribuir, imprimir, buscar, ou citar os artigos publicados, sem precisar de permissão prévia tanto do autor como da revista.</p>
                        </div>
                        
                        <div class="bg-cyan-50 dark:bg-cyan-900/20 p-5 rounded-xl border border-cyan-100 dark:border-cyan-800">
                            <h2 class="text-xl font-black text-cyan-800 dark:text-cyan-300 mb-3">🌍 Progresso da Sociedade</h2>
                            <p>A política de acesso aberto é baseada na crença de que a livre disponibilidade do conhecimento científico é essencial para o progresso da sociedade.</p>
                        </div>
                        
                        <div class="bg-emerald-50 dark:bg-emerald-900/20 p-5 rounded-xl border border-emerald-100 dark:border-emerald-800">
                            <h2 class="text-xl font-black text-emerald-800 dark:text-emerald-300 mb-3">📄 Licenciamento Creative Commons</h2>
                            <p>A revista segue as normas internacionais de licenciamento <strong>Creative Commons</strong>, permitindo que os autores partilhem os seus artigos em repositórios institucionais ou de acesso aberto, desde que a revista receba o respectivo crédito.</p>
                        </div>
                        
                        <div class="bg-amber-50 dark:bg-amber-900/20 p-5 rounded-xl border border-amber-100 dark:border-amber-800">
                            <h2 class="text-xl font-black text-amber-800 dark:text-amber-300 mb-3">💰 Sem Taxas</h2>
                            <p>A revista <strong>não cobra taxas de submissão ou de publicação</strong> aos autores.</p>
                        </div>
                        
                        <div class="bg-purple-50 dark:bg-purple-900/20 p-5 rounded-xl border border-purple-100 dark:border-purple-800">
                            <h2 class="text-xl font-black text-purple-800 dark:text-purple-300 mb-3">🔬 Transparência e Gestão de Dados</h2>
                            <p>A revista também segue as melhores práticas de gestão de dados e de transparência, garantindo que os dados utilizados nos artigos estejam disponíveis para revisão e análise pelos seus revisores.</p>
                        </div>
                    </div>
                `
            },
            en: {
                back: "Back",
                page_title: "Privacy Statement",
                page_subtitle: "Open Access and Licensing Policy",
                content: `
                    <div class="space-y-5">
                        <div class="bg-blue-50 dark:bg-blue-900/20 p-5 rounded-xl border border-blue-100 dark:border-blue-800">
                            <h2 class="text-xl font-black text-blue-800 dark:text-blue-300 mb-3">📖 Open Access</h2>
                            <p>The journal adopts an <strong>open access</strong> policy, meaning that all published articles will be available online at no cost to readers. Readers are permitted to read, download, copy, distribute, print, search, or cite the published articles without prior permission from either the author or the journal.</p>
                        </div>
                        
                        <div class="bg-cyan-50 dark:bg-cyan-900/20 p-5 rounded-xl border border-cyan-100 dark:border-cyan-800">
                            <h2 class="text-xl font-black text-cyan-800 dark:text-cyan-300 mb-3">🌍 Societal Progress</h2>
                            <p>The open access policy is based on the belief that the free availability of scientific knowledge is essential for the progress of society.</p>
                        </div>
                        
                        <div class="bg-emerald-50 dark:bg-emerald-900/20 p-5 rounded-xl border border-emerald-100 dark:border-emerald-800">
                            <h2 class="text-xl font-black text-emerald-800 dark:text-emerald-300 mb-3">📄 Creative Commons Licensing</h2>
                            <p>The journal follows international <strong>Creative Commons</strong> licensing standards, allowing authors to share their articles in institutional or open-access repositories, as long as the journal receives proper credit.</p>
                        </div>
                        
                        <div class="bg-amber-50 dark:bg-amber-900/20 p-5 rounded-xl border border-amber-100 dark:border-amber-800">
                            <h2 class="text-xl font-black text-amber-800 dark:text-amber-300 mb-3">💰 No Fees</h2>
                            <p>The journal <strong>does not charge submission or publication fees</strong> to authors.</p>
                        </div>
                        
                        <div class="bg-purple-50 dark:bg-purple-900/20 p-5 rounded-xl border border-purple-100 dark:border-purple-800">
                            <h2 class="text-xl font-black text-purple-800 dark:text-purple-300 mb-3">🔬 Transparency and Data Management</h2>
                            <p>The journal also follows best practices in data management and transparency, ensuring that data used in articles is available for review and analysis by its reviewers.</p>
                        </div>
                    </div>
                `
            }
        };

        function updateLanguage() {
            const t = textos[lang];
            document.getElementById('back-text').innerText = t.back;
            document.getElementById('page-title').innerText = t.page_title;
            document.getElementById('page-subtitle').innerText = t.page_subtitle;
            document.getElementById('content').innerHTML = t.content;
            document.getElementById('idioma-atual').innerText = lang.toUpperCase();
        }

        function toggleLang() {
            lang = lang === 'pt' ? 'en' : 'pt';
            updateLanguage();
        }

        btnIdioma?.addEventListener('click', toggleLang);
        updateLanguage();
    </script>
</body>
</html>
