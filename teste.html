<!doctype html>
<html lang="pt-pt" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notícias | UnISCED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .nav-hidden { top: -100px !important; }
        .card-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .card-glass {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body { transition: background-color 0.5s ease; }
    </style>
</head>
<body class="bg-stone-100 dark:bg-slate-900 transition-colors duration-500 pt-24 px-4">

    <header class="fixed top-0 w-full z-50 transition-all duration-500" id="header-nav">
        <nav id="navbar" class="max-w-5xl mx-auto mt-2 bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-white/20 shadow-lg rounded-2xl">
            <div class="px-6 h-16 flex justify-between items-center">
                <span class="font-bold text-xl text-gray-900 dark:text-white" id="title-main">NOTÍCIAS</span>
                <div class="flex items-center gap-6 text-xs font-bold text-gray-700 dark:text-gray-300">
                    <a href="index.html" class="hover:text-red-600 transition-colors" data-i18n="home">HOME</a>
                    <button id="themeToggle" class="hover:text-red-600 transition-colors" data-i18n="theme">MUDAR TEMA</button>
                    <button id="langToggle" class="hover:text-red-600 transition-colors border-l pl-4 border-gray-400">PT/EN</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto text-center" id="container-noticias"></main>

    <button id="backToTop" class="fixed bottom-10 right-10 bg-red-700 text-white p-4 rounded-full shadow-lg hidden hover:scale-110 transition-transform z-50">
        ↑
    </button>

    <script>
        const dict = {
            pt: { home: "HOME", theme: "MUDAR TEMA", title: "NOTÍCIAS" },
            en: { home: "HOME", theme: "CHANGE THEME", title: "NEWS" },
        };
        let currentLang = "pt";
        let isScrolling = true;

        // Auto-scroll ativado
        let autoScroll = setInterval(() => {
            if (isScrolling) window.scrollBy(0, 1);
        }, 50);

        // Para o auto-scroll se o utilizador interagir
        ["wheel", "touchstart", "mousedown"].forEach((evt) =>
            window.addEventListener(evt, () => {
                isScrolling = false;
                clearInterval(autoScroll);
            })
        );

        const noticias = [
            { titulo: "Atualização Académica", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1427085216119729%2F" },
            { titulo: "Destaque UnISCED", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1426192929542291%2F" },
            { titulo: "Notícias Recentes", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1402909368537314%2F" },
            { titulo: "Comunicado UnISCED", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1402008781960706%2F" },
            { titulo: "Destaque Académico", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1398868062274778%2F" },
            { titulo: "Aviso Importante", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1398796992281885%2F" },
            { titulo: "Interação", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1398219635672954%2F" },
            { titulo: "Notícias Gerais", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1397232439105007%2F" },
            { titulo: "Atualização", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1396046052556979%2F" },
            { titulo: "Info UnISCED", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1392163272945257%2F" },
            { titulo: "Destaque", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1390519006443017%2F" },
            { titulo: "Aviso", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1389983463163238%2F" },
            { titulo: "Notícia de Destaque", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1388873856607532%2F" },
            { titulo: "Relatório", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1385642856930632%2F" },
            { titulo: "Atualização Geral", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1384841267010791%2F" },
            { titulo: "Notícias UnISCED", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1384711863690398%2F" },
            { titulo: "Diretrizes", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1384069377087980%2F" },
            { titulo: "Comunicado", url: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2F100064547928167%2Fposts%2F1384067897088128%2F" }
        ];

        const container = document.getElementById("container-noticias");
        noticias.forEach((n) => {
            container.innerHTML += `
                <article class="card-glass p-6 mb-10 rounded-3xl shadow-xl transition-all hover:scale-[1.01]">
                    <h2 class="text-2xl font-black mb-4 text-gray-900 dark:text-white">${n.titulo}</h2>
                    <div class="overflow-hidden rounded-xl">
                        <iframe src="${n.url}" width="100%" height="550" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
                    </div>
                </article>`;
        });

        document.getElementById("themeToggle").onclick = () => document.documentElement.classList.toggle("dark");

        let lastScroll = 0;
        window.addEventListener("scroll", () => {
            const currentScroll = window.pageYOffset;
            document.getElementById("header-nav").classList.toggle("nav-hidden", currentScroll > 100 && currentScroll > lastScroll);
            document.getElementById("backToTop").classList.toggle("hidden", currentScroll < 300);
            lastScroll = currentScroll;
        });

        document.getElementById("langToggle").onclick = () => {
            currentLang = currentLang === "pt" ? "en" : "pt";
            document.querySelector('[data-i18n="home"]').innerText = dict[currentLang].home;
            document.querySelector('[data-i18n="theme"]').innerText = dict[currentLang].theme;
            document.getElementById("title-main").innerText = dict[currentLang].title;
        };

        document.getElementById("backToTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    </script>
</body>
</html>
